# ---------------------------------------------------------------------------
#  Taxonomies (tags/categories) -- not enabled
#
#  taxonomies = [{ name = "tags", feed = true, paginate_by = 20 }]
# ---------------------------------------------------------------------------

[markdown]
# Curly quotes, em dashes, ellipses.
smart_punctuation = true
# Wraps each heading in an anchor link so headings are linkable. Values:
# "none" | "left" | "right" | "heading".
insert_anchor_links = "heading"
# Footnotes at the bottom of the page rather than inline where defined.
bottom_footnotes = true
# Open outbound links in a new tab without leaking the referrer.
external_links_target_blank = true
external_links_no_referrer = true

# ---------------------------------------------------------------------------
#  Syntax highlighting
#
#  If you ever DO need a grammar giallo lacks, drop a JSON grammar in the repo
#  and point at it (paths resolve from this file's directory):
#    extra_grammars = ["syntaxes/my_lang.json"]
#    extra_themes   = ["syntaxes/my_theme.json"]
# ---------------------------------------------------------------------------
[markdown.highlighting]
# Fail the build on an unknown language in a code fence, instead of silently
# rendering it as plain text.
error_on_missing_language = true

# Naming a light AND a dark theme makes giallo emit CSS light-dark() values
# plus `color-scheme: light dark`, so code blocks follow the reader's OS theme
# with no JavaScript and no duplicate markup. sass/main.scss uses the same
# light-dark() mechanism so the page and the code blocks flip together.
# Swap in any of giallo's ~60 built-in themes; a wrong name fails the build.
light_theme = "github-light"
dark_theme = "github-dark"

[extra]
# Your own variables, reachable as config.extra.<name> in templates.
