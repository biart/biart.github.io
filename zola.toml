# ---------------------------------------------------------------------------
#  UI strings
#
#  Every piece of text the templates emit themselves goes here, fetched with
#  trans(key="...", lang=lang). This is the part that would have been a painful
#  migration if we had hard-coded English into the templates instead.
#
#  The default language's strings live in a bare [translations] table; other
#  languages use [languages.<code>.translations]. Keys must exist in EVERY
#  enabled language or the build fails with
#  "Translation key '<key>' for language '<lang>' is missing" -- which is a
#  feature: you cannot ship a half-translated site by accident.
#
#  `nav_code` / `nav_other` are looked up dynamically as "nav_" ~ <section dir>,
#  so a key named nav_<dirname> is required for each content section.
# ---------------------------------------------------------------------------
[translations]
nav_home = "Home"
nav_code = "Code"
nav_other = "Other"
latest = "Latest"
feed = "Feed"
feed_all = "All posts"
published = "Published"
not_found_title = "Page not found"
not_found_body = "There is nothing at this address. It may have moved, or never existed."
back_home = "Back to the front page"
skip_to_content = "Skip to content"
# Passed to the `date` filter. %-d is "day without leading zero".
date_format = "%B %-d, %Y"
# Locale for month names in the format above.
date_locale = "en_US"

