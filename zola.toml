# ============================================================================
#  Zola configuration.
# ============================================================================
base_url = "https://biart.github.io"

title = "biart"
description = "Notes on code, and on everything else. All opinions are my own."
author = "biart"

# Compile sass/*.scss -> public/*.css. Files named _*.scss are treated as
# partials and are not compiled on their own.
compile_sass = true

# Strips whitespace/comments from the generated HTML. It is <pre>-aware, so
# code blocks keep their formatting. Set to false if you ever want to read the
# generated HTML in public/ directly.
minify_html = true

# Colocated originals are NOT copied into the output: every URL the figure
# shortcode emits points at a generated variant in /processed_images/, so
# publishing the untouched original would be dead weight. Ignoring them here
# also sidesteps a Windows file-locking conflict where Zola copying an image
# races with resize_image reading it (error 32, "used by another process").
ignored_content = ["*.png", "*.jpg", "*.jpeg", "*.webp", "*.avif", "*.gif"]

build_search_index = false
generate_sitemap = true
generate_robots_txt = true

# ---------------------------------------------------------------------------
#  Feeds
# ---------------------------------------------------------------------------
generate_feeds = true
feed_filenames = ["atom.xml"]

# ---------------------------------------------------------------------------
#  Languages
# ---------------------------------------------------------------------------
default_language = "en"

# [languages.fr]
